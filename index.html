<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vũ Trụ Độc Hành</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌑</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #03030a;
      --card: rgba(255, 255, 255, 0.03);
      --accent: #a5b4fc;
      --text: #e2e8f0;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 2rem 0;
    }

    .nebula {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: 
        radial-gradient(circle at 20% 30%, rgba(110, 168, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      z-index: -1;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 3rem 2rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-style: italic;
      background: linear-gradient(to bottom, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    /* Thêm vùng User Profile xinh xắn */
    .user-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--accent);
    }
    .logout-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 0; margin: 0;
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Khu vực hiển thị tin nhắn đẹp hơn */
    #slogan-box {
      min-height: 120px;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #slogan {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #f1f5f9;
      font-weight: 300;
      font-style: italic;
    }
    #author {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 0.5rem;
      letter-spacing: 1px;
    }

    .input-group {
      position: relative;
    }

    textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.2rem;
      color: white;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: all 0.4s ease;
    }

    textarea:focus {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(165, 180, 252, 0.1);
    }

    button {
      margin-top: 1rem;
      background: #fff;
      color: #000;
      border: none;
      padding: 0.8rem 2.5rem;
      border-radius: 100px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.03);
      background: var(--accent);
    }

    /* CSS riêng cho nút Đăng nhập Google */
    .login-google-btn {
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid var(--border);
    }
    .login-google-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.3;
      pointer-events: none;
    }

    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="nebula"></div>

  <div class="card">
    <h1 id="title-main">Không anh em.<br>Không bạn.</h1>
    
    <!-- Hiển thị tài khoản -->
    <div id="user-area" class="user-profile hidden">
      <img id="user-img" class="user-avatar" src="" alt="avatar">
      <span id="user-name">Đang định danh...</span>
      <span>•</span>
      <button id="logoutBtn" class="logout-btn">Rời khỏi</button>
    </div>

    <!-- Khu vực hiển thị tâm sự -->
    <div id="slogan-box">
      <div id="slogan">Đang kết nối với hư vô...</div>
      <div id="author"></div>
    </div>

    <!-- Khu vực nhập liệu công khai hoặc yêu cầu đăng nhập -->
    <div class="input-group">
      <div id="guest-zone" class="hidden">
        <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #64748b;">Bạn cần định danh để gửi tín hiệu vào vũ trụ.</p>
        <button id="loginBtn" class="login-google-btn">
          <i data-lucide="log-in" size="18"></i>
          <span>Đăng nhập với Google</span>
        </button>
      </div>

      <div id="user-zone" class="hidden">
        <textarea id="newSlogan" rows="3" placeholder="Gửi một lời nhắn vào khoảng không..."></textarea>
        <button id="saveBtn">
          <span>Lưu vào vũ trụ</span>
          <i data-lucide="send" size="18"></i>
        </button>
      </div>
    </div>
    
    <div id="status" style="margin-top: 1.5rem; font-size: 0.8rem;"></div>
  </div>

  <footer>Silence &bull; 2026</footer>

  <script type="module">
    // Sử dụng cấu hình SDK Firebase đầy đủ từ đề bài
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, limitToLast, query, onChildAdded } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Cấu hình Firebase đầy đủ từ project của bạn
    const firebaseConfig = {
      apiKey: "AIzaSyC3eiZy3Jxltpx-QXKFx-WNUlKdNLhBH2I",
      authDomain: "bigdata-c9bd2.firebaseapp.com",
      databaseURL: "https://bigdata-c9bd2-default-rtdb.firebaseio.com",
      projectId: "bigdata-c9bd2",
      storageBucket: "bigdata-c9bd2.firebasestorage.app",
      messagingSenderId: "168926822259",
      appId: "1:168926822259:web:370faa96ed0698af958f06"
    };

    // Khởi tạo các dịch vụ
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const sloganRef = ref(db, "slogan");

    // Lấy các element giao diện
    const sloganEl = document.getElementById("slogan");
    const authorEl = document.getElementById("author");
    const textarea = document.getElementById("newSlogan");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");
    
    const userArea = document.getElementById("user-area");
    const userImg = document.getElementById("user-img");
    const userName = document.getElementById("user-name");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    
    const guestZone = document.getElementById("guest-zone");
    const userZone = document.getElementById("user-zone");

    let currentUser = null;

    // Khởi tạo Lucide icons cho giao diện đẹp mắt
    lucide.createIcons();

    // Theo dõi trạng thái Đăng nhập của người dùng
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        // Cập nhật UI khi đã đăng nhập
        userImg.src = user.photoURL || 'https://www.gravatar.com/avatar/?d=mp';
        userName.textContent = user.displayName;
        
        userArea.classList.remove('hidden');
        userZone.classList.remove('hidden');
        guestZone.classList.add('hidden');
      } else {
        currentUser = null;
        // Cập nhật UI khi chưa đăng nhập
        userArea.classList.add('hidden');
        userZone.classList.add('hidden');
        guestZone.classList.remove('hidden');
      }
    });

    // Sự kiện Đăng nhập bằng Google Pop-up
    loginBtn.onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Đăng nhập thất bại:", error);
        statusEl.textContent = "Không thể kết nối danh tính của bạn.";
        statusEl.style.color = "#ef4444";
      }
    };

    // Sự kiện Đăng xuất
    logoutBtn.onclick = async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Đăng xuất thất bại:", error);
      }
    };

    // Lắng nghe và hiển thị lời nhắn mới nhất từ Vũ Trụ
    // Sử dụng query limitToLast để lấy chuẩn tin nhắn cuối cùng
    const recentQuery = query(sloganRef, limitToLast(1));
    onChildAdded(recentQuery, (data) => {
      const val = data.val();
      if (val && val.text) {
        // Reset hiệu ứng animation bằng hack reflow
        sloganEl.classList.remove('fade-in');
        authorEl.classList.remove('fade-in');
        void sloganEl.offsetWidth; 

        // Hiển thị text tâm sự
        sloganEl.textContent = `"${val.text}"`;
        // Hiển thị tên người gửi nếu có, nếu không thì ẩn danh
        authorEl.textContent = val.userName ? `— Gửi từ linh hồn: ${val.userName}` : "— Khuyết danh";

        sloganEl.classList.add('fade-in');
        authorEl.classList.add('fade-in');
      }
    });

    // Lưu dữ liệu kèm thông tin tài khoản Google
    saveBtn.onclick = async () => {
      const text = textarea.value.trim();
      if (!text) return;
      if (!currentUser) {
        statusEl.textContent = "Hư vô không nhận diện được bạn.";
        statusEl.style.color = "#ef4444";
        return;
      }

      try {
        await push(sloganRef, {
          text: text,
          uid: currentUser.uid,
          userName: currentUser.displayName,
          userAvatar: currentUser.photoURL,
          timestamp: Date.now()
        });
        
        textarea.value = "";
        statusEl.textContent = "Lời nhắn đã tan vào hư không.";
        statusEl.style.color = "#a5b4fc";
        setTimeout(() => statusEl.textContent = "", 3000);
      } catch (e) {
        statusEl.textContent = "Hư vô từ chối bạn.";
        statusEl.style.color = "#ef4444";
        console.error(e);
      }
    };
  </script>
</body>
</html>
