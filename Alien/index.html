<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatter with Alien 👽</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #00ffcc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: rgba(0, 255, 200, 0.1);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00ffcc;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
        }
        .user-msg {
            align-self: flex-end;
            background: #00ffcc;
            color: #000;
            border-bottom-right-radius: 5px;
        }
        .alien-msg {
            align-self: flex-start;
            background: #1a1a2e;
            border: 1px solid #00ffcc;
            border-bottom-left-radius: 5px;
        }
        .input-area {
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #00ffcc;
            background: #1a1a2e;
            color: #fff;
            border-radius: 30px;
            font-size: 16px;
        }
        button {
            padding: 15px 25px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-btn {
            background: #4285f4;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            margin: 20px auto;
            display: block;
        }
        .alien-header {
            text-align: center;
            font-size: 2.5rem;
            margin: 10px 0;
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="alien-header">👽 Alien Chatter</h1>
        <p id="user-info" style="margin:5px; font-size:14px;"></p>
    </header>

    <div id="login-screen">
        <button onclick="googleLogin()" class="login-btn">🔑 Đăng nhập bằng Google</button>
    </div>

    <div id="chat-screen" style="display: none; flex-direction: column; height: 100%;">
        <div class="chat-container" id="chat-box"></div>
        
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Nhắn tin với Alien..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        // ================== FIREBASE CONFIG ==================
        const firebaseConfig = {
            apiKey: "AIzaSyDVRzkeY2reKjR5Gv0dHx55geqgivUjEAQ",
            authDomain: "urf1forall.firebaseapp.com",
            databaseURL: "https://urf1forall-default-rtdb.firebaseio.com",
            projectId: "urf1forall",
            storageBucket: "urf1forall.firebasestorage.app",
            messagingSenderId: "335719421403",
            appId: "1:335719421403:web:2b9c0913e8c06125a4c3fe",
            measurementId: "G-LMPT0WLMGL"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let chatRef = null;

        // Alien responses (có thể mở rộng)
        const alienResponses = [
            "👽 Zog zog! Trên hành tinh tôi, mọi người giao tiếp bằng ánh sáng.",
            "🌌 Tôi đến từ hệ sao Gliese 581g. Bạn đang nghĩ gì vậy?",
            "🛸 Con người các bạn thật thú vị! Kể tôi nghe về Trái Đất đi.",
            "🔭 Theo tôi biết, vũ trụ này rộng lớn hơn bạn tưởng rất nhiều.",
            "🌠 Hôm nay tôi thấy bạn đang rất tò mò. Có bí mật gì không?",
            "👽 Haha, con người hay dùng emoji. Tôi thích cái này: 🪐",
            "🚀 Muốn đi du hành cùng tôi không? Chỉ cần nhắm mắt lại thôi.",
            "🌍 Trái Đất đẹp thật, nhưng hơi ồn ào so với không gian.",
        ];

        function getRandomResponse() {
            return alienResponses[Math.floor(Math.random() * alienResponses.length)];
        }

        // Google Login
        async function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                currentUser = result.user;
                showChatScreen();
            } catch (error) {
                console.error(error);
                alert("Đăng nhập thất bại: " + error.message);
            }
        }

        function showChatScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            
            document.getElementById('user-info').innerHTML = `
                Xin chào <b>${currentUser.displayName}</b> 👋
                <button onclick="logout()" style="margin-left:15px; font-size:12px; padding:5px 10px;">Đăng xuất</button>
            `;

            // Tạo reference theo user
            chatRef = database.ref('chats/' + currentUser.uid);
            
            // Load lịch sử chat
            loadChatHistory();
            
            // Listen realtime
            chatRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                addMessageToUI(msg);
            });
        }

        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        function loadChatHistory() {
            chatRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    Object.values(data).forEach(msg => {
                        addMessageToUI(msg);
                    });
                }
            });
        }

        function addMessageToUI(msg) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${msg.sender === 'user' ? 'user-msg' : 'alien-msg'}`;
            div.innerHTML = `
                <strong>${msg.sender === 'user' ? 'Bạn' : 'Alien 👽'}</strong><br>
                ${msg.text}
                <small style="display:block; margin-top:5px; opacity:0.7;">${new Date(msg.timestamp).toLocaleTimeString('vi-VN')}</small>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser || !chatRef) return;

            const userMsg = {
                sender: 'user',
                text: text,
                timestamp: Date.now()
            };

            // Lưu tin nhắn người dùng
            await chatRef.push(userMsg);
            
            input.value = '';

            // Alien trả lời sau 800ms
            setTimeout(async () => {
                const alienReply = {
                    sender: 'alien',
                    text: getRandomResponse(),
                    timestamp: Date.now()
                };
                await chatRef.push(alienReply);
            }, 800);
        }

        // Auth state listener
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                showChatScreen();
            }
        });
    </script>
</body>
</html>
