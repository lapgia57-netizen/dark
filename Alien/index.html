<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Chat Với Alien Zog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

    // ================== CONFIG CỦA BẠN ==================
    const firebaseConfig = {
      apiKey: "AIzaSyDVRzkeY2reKjR5Gv0dHx55geqgivUjEAQ",
      authDomain: "urf1forall.firebaseapp.com",
      databaseURL: "https://urf1forall-default-rtdb.firebaseio.com",
      projectId: "urf1forall",
      storageBucket: "urf1forall.firebasestorage.app",
      messagingSenderId: "335719421403",
      appId: "1:335719421403:web:2b9c0913e8c06125a4c3fe",
      measurementId: "G-LMPT0WLMGL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.firebaseSDK = { auth, db, ref, push, onChildAdded, serverTimestamp, signInWithPopup, signOut, onAuthStateChanged, provider };
  </script>
</head>
<body class="bg-gradient-to-br from-purple-950 via-black to-blue-950 text-white min-h-screen">
  <div class="max-w-2xl mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 mt-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center text-3xl animate-pulse">👽</div>
        <div>
          <h1 class="text-3xl font-bold">Zog the Alien</h1>
          <p class="text-green-400 text-sm">Từ hành tinh Zorath • Online</p>
        </div>
      </div>
      <button id="loginBtn" onclick="login()" class="bg-white text-black px-5 py-2 rounded-full font-medium flex items-center gap-2 hover:bg-green-400 transition">
        <i class="fab fa-google"></i> Đăng nhập Google
      </button>
      <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 px-5 py-2 rounded-full font-medium">Đăng xuất</button>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="text-center py-20">
      <div class="text-8xl mb-6 animate-bounce">👽</div>
      <h2 class="text-4xl font-bold mb-4">Chào Trái Đất!</h2>
      <p class="text-xl text-gray-300">Đăng nhập bằng Google để bắt đầu cuộc trò chuyện với tôi</p>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="hidden">
      <div id="messages" class="h-[70vh] overflow-y-auto space-y-4 p-4 bg-black/30 rounded-3xl border border-green-500/30 mb-4 backdrop-blur-sm"></div>
      
      <div class="flex gap-3">
        <input id="messageInput" type="text" placeholder="Nhắn gì với Zog đi..." 
               class="flex-1 bg-black/50 border border-green-500/50 rounded-full px-6 py-4 focus:outline-none focus:border-green-400 text-white">
        <button onclick="sendMessage()" 
                class="bg-green-500 hover:bg-green-400 w-14 h-14 rounded-full flex items-center justify-center text-2xl transition">
          →
        </button>
      </div>
      <p class="text-center text-xs text-gray-500 mt-3">Tin nhắn sẽ được lưu vĩnh viễn trong Firebase của bạn</p>
    </div>
  </div>

  <script type="module">
    const { auth, db, ref, push, onChildAdded, serverTimestamp, signInWithPopup, signOut, onAuthStateChanged, provider } = window.firebaseSDK;

    let currentUser = null;
    let messagesRef = null;

    // Xử lý đăng nhập
    window.login = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        console.log("Đăng nhập thành công", result.user);
      } catch (error) {
        alert("Lỗi đăng nhập: " + error.message);
      }
    };

    window.logout = () => {
      signOut(auth);
    };

    // Theo dõi trạng thái đăng nhập
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        
        loadMessages();
      } else {
        currentUser = null;
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('chatScreen').classList.add('hidden');
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
      }
    });

    function loadMessages() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '<p class="text-center text-green-400">Đang kết nối với Zog...</p>';

      messagesRef = ref(db, 'chats/' + currentUser.uid);

      onChildAdded(messagesRef, (snapshot) => {
        const msg = snapshot.val();
        appendMessage(msg);
      });
    }

    function appendMessage(msg) {
      const messagesDiv = document.getElementById('messages');
      const isUser = msg.sender === 'user';

      const bubble = document.createElement('div');
      bubble.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
      bubble.innerHTML = `
        <div class="max-w-[80%]">
          <div class="${isUser ? 'bg-green-600' : 'bg-purple-600'} px-5 py-3 rounded-3xl rounded-${isUser ? 'tr' : 'tl'}-none">
            ${msg.text}
          </div>
          <p class="text-xs text-gray-500 mt-1 px-2">${new Date(msg.timestamp).toLocaleTimeString('vi-VN')}</p>
        </div>
      `;
      messagesDiv.appendChild(bubble);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      // Lưu tin nhắn người dùng
      await push(ref(db, 'chats/' + currentUser.uid), {
        sender: 'user',
        text: text,
        timestamp: serverTimestamp()
      });

      input.value = '';

      // Phản hồi của Alien (có thể thay bằng API Grok/OpenAI sau)
      setTimeout(async () => {
        const alienResponses = [
          "Zrgl! Trên hành tinh Zorath chúng tôi không có khái niệm 'cà phê'. Ngươi đang uống gì vậy?",
          "Tôi đến từ thiên hà Andromeda. Ngươi có muốn xem ảnh sao băng không? 👽",
          "Con người thật thú vị. Sao các ngươi lại thích meme đến vậy?",
          "Zog đồng ý! Chúng ta nên xâm lược Trái Đất... bằng meme.",
          "Haha, câu hỏi hay! Câu trả lời là... 42 🌌",
          "Tôi đang học tiếng Việt qua TikTok. 'Đỉnh của chóp' nghĩa là gì vậy?",
        ];

        const randomReply = alienResponses[Math.floor(Math.random() * alienResponses.length)];

        await push(ref(db, 'chats/' + currentUser.uid), {
          sender: 'alien',
          text: randomReply,
          timestamp: serverTimestamp()
        });
      }, 800);
    }

    // Gửi tin nhắn khi nhấn Enter
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
