<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KHO DỮ LIỆU ĐIỀU TRA 24/7 - READ ONLY</title>
  
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/1161/1161388.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #0f172a;
      --accent-color: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #334155;
      --border-radius: 12px;
      --box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Roboto', sans-serif; background: var(--bg-color); color: var(--text-main); line-height: 1.5; padding-bottom: 40px; }

    .container { max-width: 900px; margin: 0 auto; padding: 15px; }

    /* Header */
    header { 
      background: var(--primary-color); 
      color: white; 
      padding: 15px 20px; 
      border-radius: var(--border-radius); 
      margin-bottom: 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: var(--box-shadow);
    }
    h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .badge-readonly { background: #ef4444; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

    /* Counter Bar */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      text-align: center;
    }
    .stat-card .val { font-size: 20px; font-weight: 700; color: var(--accent-color); }
    .stat-card .lbl { font-size: 12px; color: #64748b; }

    /* Filter & Search Input */
    .search-box { margin-bottom: 20px; position: relative; }
    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border: 1px solid #cbd5e1;
      border-radius: var(--border-radius);
      outline: none;
      font-size: 14px;
      background: white;
    }
    .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

    /* User Block Container */
    .user-block {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .user-header {
      background: #f8fafc;
      padding: 12px 15px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--primary-color);
      font-size: 14px;
    }

    /* Record Items */
    .record-list { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .record-card {
      background: #f8fafc;
      border-left: 4px solid var(--accent-color);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .record-original { font-weight: 700; color: #0f172a; word-break: break-all; margin-bottom: 6px; font-size: 14px; }
    .record-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px; color: #64748b; font-size: 12px; margin-top: 4px; }
    .hash-val { font-family: monospace; color: #334155; word-break: break-all; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }

    /* JSON Raw Viewer Toggle */
    .raw-section { margin-top: 30px; }
    .raw-section summary { font-size: 14px; font-weight: 700; cursor: pointer; color: var(--accent-color); padding: 10px 0; }
    pre { background: #0f172a; color: #38bdf8; padding: 15px; border-radius: var(--border-radius); font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }

    .loading-state, .empty-state { text-align: center; padding: 40px 10px; color: #64748b; }
    .search-highlight { background: #fef08a; padding: 0 2px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-database"></i> Kho Dữ Liệu DB All</h1>
      <span class="badge-readonly"><i class="fas fa-lock"></i> CHỈ ĐỌC</span>
    </header>

    <!-- Thống kê nhanh -->
    <div class="summary-bar">
      <div class="stat-card">
        <div class="val" id="totalUsers">0</div>
        <div class="lbl">Tài khoản User</div>
      </div>
      <div class="stat-card">
        <div class="val" id="totalRecords">0</div>
        <div class="lbl">Tổng bản ghi lưu trữ</div>
      </div>
    </div>

    <!-- Ô tìm kiếm -->
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Tìm kiếm bất kỳ thông tin nào trong DB..." onkeyup="filterData()">
    </div>

    <!-- Danh sách dữ liệu hiển thị -->
    <div id="contentDisplay">
      <div class="loading-state">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Đang quét toàn bộ dữ liệu từ Database...</p>
      </div>
    </div>

    <!-- Xem dữ liệu JSON thô -->
    <details class="raw-section">
      <summary><i class="fas fa-code"></i> Xem cấu trúc JSON gốc (Raw DB Output)</summary>
      <pre id="jsonRaw">Đang tải...</pre>
    </details>
  </div>

  <!-- FIREBASE REALTIME DATABASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDcHZ1RIALvsXC7iRey5y-8ek-j8bFP82U",
      authDomain: "proxyinternetcave.firebaseapp.com",
      databaseURL: "https://proxyinternetcave-default-rtdb.firebaseio.com",
      projectId: "proxyinternetcave",
      storageBucket: "proxyinternetcave.firebasestorage.app",
      messagingSenderId: "811924386251",
      appId: "1:811924386251:web:c3a94878f922e6fdde464e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let globalDbData = null;

    // Highlight từ khóa tìm kiếm
    const highlight = (text, query) => {
      if (!query || !text) return text || '';
      return String(text).replace(new RegExp(`(${query})`, 'gi'), '<span class="search-highlight">$1</span>');
    };

    // Lấy TOÀN BỘ dữ liệu nút gốc 'dieuTra'
    const rootDbRef = ref(db, "dieuTra");
    
    onValue(rootDbRef, (snapshot) => {
      if (!snapshot.exists()) {
        document.getElementById("contentDisplay").innerHTML = '<div class="empty-state"><i class="fas fa-folder-open fa-2x"></i><p>Database hiện đang trống!</p></div>';
        document.getElementById("jsonRaw").textContent = "{}";
        return;
      }

      globalDbData = snapshot.val();
      document.getElementById("jsonRaw").textContent = JSON.stringify(globalDbData, null, 2);
      renderAllData(globalDbData);
    }, (error) => {
      document.getElementById("contentDisplay").innerHTML = `<div class="empty-state" style="color:#ef4444;"><i class="fas fa-exclamation-triangle fa-2x"></i><p>Lỗi đọc Database: ${error.message}<br><small>(Vui lòng kiểm tra Firebase Rules cho phép Read public)</small></p></div>`;
    });

    window.renderAllData = (dbData, query = "") => {
      const container = document.getElementById("contentDisplay");
      const usersData = dbData.users || {};
      
      const userKeys = Object.keys(usersData);
      let totalRecordsCount = 0;
      let htmlContent = "";

      userKeys.forEach((uid, index) => {
        const userObj = usersData[uid];
        const records = userObj.data || {};
        const recordKeys = Object.keys(records);

        // Lọc danh sách dữ liệu theo từ khóa tìm kiếm
        const filteredRecords = recordKeys.filter(rKey => {
          const item = records[rKey];
          if (!query) return true;
          return (item.original && item.original.toLowerCase().includes(query)) ||
                 (item.sha && item.sha.toLowerCase().includes(query)) ||
                 (item.hashedKey && item.hashedKey.toLowerCase().includes(query)) ||
                 (item.ip && item.ip.toLowerCase().includes(query)) ||
                 uid.toLowerCase().includes(query);
        });

        if (filteredRecords.length > 0) {
          totalRecordsCount += filteredRecords.length;

          htmlContent += `
            <div class="user-block">
              <div class="user-header">
                <i class="fas fa-user-circle"></i>
                <span>User UID: ${highlight(uid, query)}</span>
                <span style="margin-left:auto; font-size:11px; font-weight:normal; background:#e2e8f0; padding:2px 8px; border-radius:10px;">${filteredRecords.length} bản ghi</span>
              </div>
              <div class="record-list">
                ${filteredRecords.map(rKey => {
                  const d = records[rKey];
                  return `
                    <div class="record-card">
                      <div class="record-original">${highlight(d.original || 'Không có nội dung gốc', query)}</div>
                      <div class="record-row">
                        <span>SHA256: <span class="hash-val">${highlight(d.sha || 'N/A', query)}</span></span>
                      </div>
                      <div class="record-row">
                        <span>MD5/Key: <span class="hash-val">${highlight(d.hashedKey || rKey, query)}</span></span>
                      </div>
                      <div class="record-row" style="margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 4px;">
                        <span><i class="fas fa-network-wired"></i> IP: ${highlight(d.ip || 'Ẩn danh', query)}</span>
                        <span><i class="far fa-clock"></i> VN: ${d.timeVN || '---'}</span>
                        <span><i class="far fa-clock"></i> KR: ${d.timeKR || '---'}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      });

      // Cập nhật thẻ đếm
      document.getElementById("totalUsers").textContent = userKeys.length;
      document.getElementById("totalRecords").textContent = totalRecordsCount;

      container.innerHTML = htmlContent || '<div class="empty-state"><i class="fas fa-search fa-2x"></i><p>Không tìm thấy bản ghi phù hợp</p></div>';
    };

    window.filterData = () => {
      if (!globalDbData) return;
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      renderAllData(globalDbData, q);
    };
  </script>
</body>
</html>
